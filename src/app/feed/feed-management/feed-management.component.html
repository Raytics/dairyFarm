<div class="feed-container">
  <div class="feed-header">
    <h2>Feed Management</h2>
    <button mat-raised-button color="primary" routerLink="add-feed">
      + Create Feed
    </button>
  </div>

  <table mat-table [dataSource]="feedData" class="mat-elevation-z8 feed-table">

    <!-- Feed Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Feed Name </th>
      <td mat-cell *matCellDef="let feed"> {{feed.name}} </td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> Quantity (kg) </th>
      <td mat-cell *matCellDef="let feed"> {{feed.quantity}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let feed"> {{feed.date | date}} </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let feed">
        <button mat-icon-button color="accent" (click)="editFeed(feed)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteFeed(feed.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="feedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: feedColumns;"></tr>
  </table>
</div>
